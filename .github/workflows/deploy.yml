name: Deploy Singapore

on:
  workflow_dispatch:

concurrency:
  group: safeloop-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: asia-southeast1
  SUPABASE_REGION: ap-southeast-1
  VERCEL_REGION: sin1
  VERCEL_CLI_VERSION: 59.5.0

jobs:
  region-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse a global or non-Singapore runtime
        run: |
          test "$GCP_REGION" = "asia-southeast1"
          test "$SUPABASE_REGION" = "ap-southeast-1"
          test "$VERCEL_REGION" = "sin1"
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("frontend/vercel.json").read_text())
          if config.get("regions") != ["sin1"]:
              raise SystemExit("Vercel compute must remain in Singapore")
          PY

  migrate:
    needs: region-contract
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Apply tracked migrations before application deployment
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL"
          supabase db push --db-url "$SUPABASE_DB_URL"

  backend:
    needs: migrate
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - id: deploy
        name: Deploy the regional backend container
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
        run: |
          test -n "$GCP_PROJECT_ID"
          test -n "$GCP_RUNTIME_SERVICE_ACCOUNT"
          test -n "$FRONTEND_ORIGIN"
          gcloud run deploy safeloop-api \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --source=backend \
            --service-account="$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --allow-unauthenticated \
            --set-env-vars="^@^APP_ENV=production@ALLOW_DEBUG_AUTH=false@AI_PROVIDER=vertex@VERTEX_PROJECT_ID=$GCP_PROJECT_ID@VERTEX_LOCATION=$GCP_REGION@LIVE_TRANSCRIPTION_ENABLED=true@VERTEX_LIVE_TRANSCRIPTION_MODEL=gemini-3.5-transcribe-live-preview@VERTEX_LIVE_TRANSCRIPTION_LOCATION=global@SITE_TIMEZONE=Asia/Singapore@SUPPORTED_LOCALES=en,zh-CN@FRONTEND_ORIGINS=$FRONTEND_ORIGIN" \
            --set-secrets="DATABASE_URL=safeloop-database-url:latest,SUPABASE_JWT_SECRET=safeloop-jwt-secret:latest,SUPABASE_URL=safeloop-url:latest,SUPABASE_SERVICE_ROLE_KEY=safeloop-service-role-key:latest"
          backend_url="$(gcloud run services describe safeloop-api \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='value(status.url)')"
          echo "url=$backend_url" >> "$GITHUB_OUTPUT"
          curl --fail --silent --show-error "$backend_url/health"
          curl --fail --silent --show-error "$backend_url/health/deep"

  frontend:
    needs: backend
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefer-offline --no-audit
      - name: Build with the Vercel production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOYED_BACKEND_URL: ${{ needs.backend.outputs.url }}
        run: |
          test -n "$DEPLOYED_BACKEND_URL"
          npx --yes "vercel@$VERCEL_CLI_VERSION" pull --yes --environment=production --token="$VERCEL_TOKEN"
          backend_ws_url="${DEPLOYED_BACKEND_URL/https:/wss:}"
          BACKEND_URL="$DEPLOYED_BACKEND_URL" \
          NEXT_PUBLIC_BACKEND_URL="$DEPLOYED_BACKEND_URL" \
          NEXT_PUBLIC_BACKEND_WS_URL="$backend_ws_url" \
            npx --yes "vercel@$VERCEL_CLI_VERSION" build --prod --token="$VERCEL_TOKEN"
      - name: Deploy the prebuilt frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          deployment_url="$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          curl --fail --silent --show-error --location "$deployment_url/en" >/dev/null
